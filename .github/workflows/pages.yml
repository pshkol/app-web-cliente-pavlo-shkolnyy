name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generar la configuración pública
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/configurar.mjs

      - name: Preparar los archivos del sitio
        run: |
          mkdir _site
          cp ./*.html _site/
          cp -R js styles _site/

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
